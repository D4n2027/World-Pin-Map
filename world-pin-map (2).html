<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Pin Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root,[data-theme="light"]{
  --color-bg:#f7f6f2;--color-surface:#f9f8f5;--color-surface-2:#fbfbf9;
  --color-surface-offset:#f3f0ec;--color-border:#d4d1ca;--color-divider:#dcd9d5;
  --color-text:#28251d;--color-text-muted:#7a7974;--color-text-faint:#bab9b4;
  --color-primary:#01696f;--color-primary-hover:#0c4e54;--color-primary-highlight:#cedcd8;
  --color-error:#a12c7b;--color-success:#437a22;
  --shadow-sm:0 1px 2px oklch(0.2 0.01 80/0.06);
  --shadow-md:0 4px 12px oklch(0.2 0.01 80/0.08);
  --shadow-lg:0 12px 32px oklch(0.2 0.01 80/0.12);
  --radius-sm:0.375rem;--radius-md:0.5rem;--radius-lg:0.75rem;--radius-xl:1rem;--radius-full:9999px;
  --text-xs:clamp(0.75rem,0.7rem+0.25vw,0.875rem);
  --text-sm:clamp(0.875rem,0.8rem+0.35vw,1rem);
  --text-base:clamp(1rem,0.95rem+0.25vw,1.125rem);
  --text-lg:clamp(1.125rem,1rem+0.75vw,1.5rem);
  --space-1:0.25rem;--space-2:0.5rem;--space-3:0.75rem;--space-4:1rem;
  --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;
  --font-body:'Satoshi','Inter',sans-serif;
  --transition:180ms cubic-bezier(0.16,1,0.3,1);
}
[data-theme="dark"]{
  --color-bg:#171614;--color-surface:#1c1b19;--color-surface-2:#201f1d;
  --color-surface-offset:#22211f;--color-border:#393836;--color-divider:#262523;
  --color-text:#cdccca;--color-text-muted:#797876;--color-text-faint:#5a5957;
  --color-primary:#4f98a3;--color-primary-hover:#227f8b;--color-primary-highlight:#313b3b;
  --color-error:#d163a7;--color-success:#6daa45;
  --shadow-sm:0 1px 2px oklch(0 0 0/0.2);
  --shadow-md:0 4px 12px oklch(0 0 0/0.3);
  --shadow-lg:0 12px 32px oklch(0 0 0/0.4);
}
@media(prefers-color-scheme:dark){:root:not([data-theme]){
  --color-bg:#171614;--color-surface:#1c1b19;--color-surface-2:#201f1d;
  --color-surface-offset:#22211f;--color-border:#393836;--color-divider:#262523;
  --color-text:#cdccca;--color-text-muted:#797876;--color-text-faint:#5a5957;
  --color-primary:#4f98a3;--color-primary-hover:#227f8b;--color-primary-highlight:#313b3b;
  --color-error:#d163a7;--color-success:#6daa45;
}}
html{-webkit-font-smoothing:antialiased}
body{min-height:100dvh;font-family:var(--font-body);font-size:var(--text-base);color:var(--color-text);background:var(--color-bg);display:flex;flex-direction:column}
a,button,input,select{transition:color var(--transition),background var(--transition),border-color var(--transition),box-shadow var(--transition)}
button{cursor:pointer;background:none;border:none;font:inherit;color:inherit}
input,select{font:inherit;color:inherit}

/* HEADER */
header{background:var(--color-surface);border-bottom:1px solid var(--color-border);padding:var(--space-3) var(--space-6);display:flex;align-items:center;gap:var(--space-4);box-shadow:var(--shadow-sm);z-index:100;position:relative}
.logo{display:flex;align-items:center;gap:var(--space-2);flex-shrink:0}
.logo svg{color:var(--color-primary)}
.logo-text{font-size:var(--text-lg);font-weight:700;letter-spacing:-0.02em}
.header-right{margin-left:auto;display:flex;align-items:center;gap:var(--space-3)}
.pin-count{font-size:var(--text-sm);color:var(--color-text-muted);background:var(--color-surface-offset);padding:var(--space-1) var(--space-3);border-radius:var(--radius-full);border:1px solid var(--color-border)}
.pin-count span{color:var(--color-primary);font-weight:700}
.icon-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);color:var(--color-text-muted);border:1px solid transparent}
.icon-btn:hover{background:var(--color-surface-offset);color:var(--color-text)}

/* LAYOUT */
.app{display:flex;flex:1;overflow:hidden;height:calc(100dvh - 57px)}

/* SIDEBAR */
.sidebar{width:320px;flex-shrink:0;background:var(--color-surface);border-right:1px solid var(--color-border);display:flex;flex-direction:column;overflow:hidden}

/* TABS */
.tab-bar{display:flex;border-bottom:1px solid var(--color-divider);background:var(--color-surface)}
.tab{flex:1;padding:var(--space-2) var(--space-3);font-size:var(--text-xs);font-weight:600;color:var(--color-text-muted);text-align:center;border-bottom:2px solid transparent;transition:all var(--transition)}
.tab.active{color:var(--color-primary);border-bottom-color:var(--color-primary)}
.tab:hover:not(.active){color:var(--color-text);background:var(--color-surface-offset)}
.tab-panel{display:none;flex-direction:column;flex:1;overflow:hidden}
.tab-panel.active{display:flex}

/* SEARCH TAB */
.sidebar-section{padding:var(--space-4);border-bottom:1px solid var(--color-divider)}
.section-label{font-size:var(--text-xs);font-weight:600;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:var(--space-3)}
.input-group{display:flex;gap:var(--space-2)}
.text-input{flex:1;background:var(--color-surface-offset);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-2) var(--space-3);font-size:var(--text-sm);outline:none}
.text-input:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px oklch(from var(--color-primary) l c h/0.15)}
.text-input::placeholder{color:var(--color-text-faint)}
select.text-input{cursor:pointer}
.btn-primary{background:var(--color-primary);color:#fff;border-radius:var(--radius-md);padding:var(--space-2) var(--space-4);font-size:var(--text-sm);font-weight:600;white-space:nowrap}
.btn-primary:hover{background:var(--color-primary-hover)}
.btn-primary:active{transform:scale(0.97)}
.btn-sm{padding:var(--space-1) var(--space-3);font-size:var(--text-xs);border-radius:var(--radius-md);font-weight:600}

/* FILTER BAR */
.filter-bar{padding:var(--space-3) var(--space-4);display:flex;gap:var(--space-2);flex-wrap:wrap;border-bottom:1px solid var(--color-divider)}
.cat-chip{font-size:var(--text-xs);padding:3px 10px;border-radius:var(--radius-full);border:1px solid var(--color-border);color:var(--color-text-muted);cursor:pointer;transition:all var(--transition);display:flex;align-items:center;gap:4px}
.cat-chip:hover,.cat-chip.active{border-color:var(--color-primary);color:var(--color-primary);background:var(--color-primary-highlight)}
.chip-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* PINS LIST */
.pins-list{flex:1;overflow-y:auto;padding:var(--space-3)}
.pins-list::-webkit-scrollbar{width:4px}
.pins-list::-webkit-scrollbar-thumb{background:var(--color-divider);border-radius:var(--radius-full)}
.pin-item{display:flex;align-items:flex-start;gap:var(--space-3);padding:var(--space-3);border-radius:var(--radius-lg);border:1px solid transparent;cursor:pointer;transition:all var(--transition);margin-bottom:var(--space-2)}
.pin-item:hover{background:var(--color-surface-offset);border-color:var(--color-border)}
.pin-item.focused{background:var(--color-primary-highlight);border-color:var(--color-primary)}
.pin-icon{width:32px;height:32px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.pin-info{flex:1;min-width:0}
.pin-name{font-size:var(--text-sm);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin-meta{font-size:var(--text-xs);color:var(--color-text-muted);margin-top:2px;display:flex;align-items:center;gap:var(--space-2)}
.pin-cat-badge{padding:1px 6px;border-radius:var(--radius-full);font-size:10px;font-weight:600}
.pin-delete{opacity:0;width:24px;height:24px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--color-error);transition:opacity var(--transition);flex-shrink:0}
.pin-item:hover .pin-delete{opacity:1}
.pin-delete:hover{background:oklch(from var(--color-error) l c h/0.1)}

/* CATEGORIES TAB */
.cats-list{flex:1;overflow-y:auto;padding:var(--space-3)}
.cat-card{background:var(--color-surface-offset);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-2);display:flex;align-items:center;gap:var(--space-3)}
.cat-swatch{width:36px;height:36px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;position:relative;cursor:pointer}
.cat-swatch input[type=color]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:none;padding:0}
.cat-details{flex:1;min-width:0}
.cat-name-row{display:flex;align-items:center;gap:var(--space-2)}
.cat-name-input{background:transparent;border:none;font-size:var(--text-sm);font-weight:600;width:100%;outline:none;color:var(--color-text);padding:2px 0;border-bottom:1px solid transparent}
.cat-name-input:focus{border-bottom-color:var(--color-primary)}
.cat-emoji-input{width:36px;background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:var(--radius-sm);text-align:center;font-size:16px;padding:2px;outline:none}
.cat-emoji-input:focus{border-color:var(--color-primary)}
.cat-count{font-size:var(--text-xs);color:var(--color-text-faint);margin-top:2px}
.cat-del{opacity:0;width:24px;height:24px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--color-error);transition:opacity var(--transition);flex-shrink:0}
.cat-card:hover .cat-del{opacity:1}
.add-cat-row{padding:var(--space-3) var(--space-4);border-top:1px solid var(--color-divider)}
.add-cat-form{display:flex;gap:var(--space-2);align-items:center}
.emoji-pick{width:40px;text-align:center;background:var(--color-surface-offset);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-2);font-size:16px;outline:none}
.emoji-pick:focus{border-color:var(--color-primary)}

/* EMPTY */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:var(--space-10) var(--space-6);color:var(--color-text-muted);gap:var(--space-3)}
.empty-icon{font-size:36px;opacity:0.4}
.empty-state h3{font-size:var(--text-base);font-weight:600;color:var(--color-text)}
.empty-state p{font-size:var(--text-sm);max-width:30ch}

/* MAP */
#map{flex:1;z-index:1}
.leaflet-control-zoom{border:1px solid var(--color-border)!important;border-radius:var(--radius-md)!important;overflow:hidden;box-shadow:var(--shadow-md)!important}
.leaflet-control-zoom-in,.leaflet-control-zoom-out{background:var(--color-surface)!important;color:var(--color-text)!important;border:none!important;width:32px!important;height:32px!important;line-height:32px!important;font-size:18px!important}
.leaflet-control-zoom-in:hover,.leaflet-control-zoom-out:hover{background:var(--color-surface-offset)!important}

/* TOAST */
.toast{position:fixed;bottom:var(--space-6);left:50%;transform:translateX(-50%) translateY(20px);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:var(--space-3) var(--space-5);font-size:var(--text-sm);box-shadow:var(--shadow-lg);z-index:9999;opacity:0;transition:all 0.3s cubic-bezier(0.16,1,0.3,1);pointer-events:none;white-space:nowrap;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-color:var(--color-success);color:var(--color-success)}
.toast.error{border-color:var(--color-error);color:var(--color-error)}
.toast.info{border-color:var(--color-primary);color:var(--color-primary)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:oklch(0.1 0 0/0.5);z-index:500;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--color-surface);border-radius:var(--radius-xl);padding:var(--space-6);width:360px;max-width:92vw;box-shadow:var(--shadow-lg);transform:scale(0.95);transition:transform 0.2s cubic-bezier(0.16,1,0.3,1)}
.modal-overlay.open .modal{transform:scale(1)}
.modal h3{font-size:var(--text-lg);font-weight:700;margin-bottom:var(--space-4)}
.modal label{display:block;font-size:var(--text-sm);font-weight:500;margin-bottom:var(--space-1);color:var(--color-text-muted)}
.modal-field{margin-bottom:var(--space-4)}
.modal input,.modal select{width:100%;background:var(--color-surface-offset);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-2) var(--space-3);font-size:var(--text-sm);color:var(--color-text)}
.modal input:focus,.modal select:focus{outline:none;border-color:var(--color-primary)}
.modal select{cursor:pointer}
.modal-btns{display:flex;gap:var(--space-3);justify-content:flex-end}
.btn-cancel{background:var(--color-surface-offset);color:var(--color-text-muted);border-radius:var(--radius-md);padding:var(--space-2) var(--space-4);font-size:var(--text-sm);font-weight:500}
.btn-cancel:hover{background:var(--color-border)}
.btn-confirm{background:var(--color-primary);color:#fff;border-radius:var(--radius-md);padding:var(--space-2) var(--space-5);font-size:var(--text-sm);font-weight:600}
.btn-confirm:hover{background:var(--color-primary-hover)}

/* PIN ANIMATION */
@keyframes pin-drop{0%{transform:translateY(-20px) scale(0.8);opacity:0}70%{transform:translateY(3px) scale(1.1)}100%{transform:translateY(0) scale(1);opacity:1}}
.custom-pin{animation:pin-drop 0.4s cubic-bezier(0.16,1,0.3,1) forwards}

/* MOBILE */
@media(max-width:640px){
  .sidebar{position:absolute;bottom:0;left:0;right:0;width:100%;height:50%;z-index:50;border-right:none;border-top:1px solid var(--color-border);border-radius:var(--radius-xl) var(--radius-xl) 0 0}
  .app{flex-direction:column}
  #map{height:50%}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-label="World Pin Map">
      <circle cx="14" cy="14" r="12" stroke="currentColor" stroke-width="2"/>
      <ellipse cx="14" cy="14" rx="5.5" ry="12" stroke="currentColor" stroke-width="1.5"/>
      <line x1="3" y1="10" x2="25" y2="10" stroke="currentColor" stroke-width="1.5"/>
      <line x1="2" y1="14" x2="26" y2="14" stroke="currentColor" stroke-width="1.5"/>
      <line x1="3" y1="18" x2="25" y2="18" stroke="currentColor" stroke-width="1.5"/>
    </svg>
    <span class="logo-text">World Pin Map</span>
  </div>
  <div class="header-right">
    <div class="pin-count"><span id="pin-count-num">0</span> pins</div>
    <button class="icon-btn" id="export-btn" title="Export pins as JSON">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
    <button class="icon-btn" data-theme-toggle aria-label="Toggle dark mode">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="tab-bar">
      <button class="tab active" data-tab="pins">📍 Pins</button>
      <button class="tab" data-tab="categories">🏷️ Categories</button>
    </div>

    <!-- PINS TAB -->
    <div class="tab-panel active" id="tab-pins">
      <div class="sidebar-section">
        <div class="section-label">Add a Location</div>
        <div class="input-group">
          <input type="text" id="location-input" class="text-input" placeholder="City, address, landmark…" autocomplete="off"/>
          <button class="btn-primary" id="add-btn">Pin it</button>
        </div>
        <div style="margin-top:var(--space-3)">
          <select id="cat-select" class="text-input" style="width:100%"></select>
        </div>
      </div>
      <div class="filter-bar" id="filter-bar">
        <button class="cat-chip active" data-cat="__all__">All</button>
      </div>
      <div class="pins-list" id="pins-list">
        <div class="empty-state" id="empty-state">
          <div class="empty-icon">🌍</div>
          <h3>No pins yet</h3>
          <p>Search for a location or click the map to drop your first pin</p>
        </div>
      </div>
    </div>

    <!-- CATEGORIES TAB -->
    <div class="tab-panel" id="tab-categories">
      <div style="padding:var(--space-4);border-bottom:1px solid var(--color-divider)">
        <div class="section-label">Your Pin Categories</div>
        <p style="font-size:var(--text-xs);color:var(--color-text-muted)">Click a name or emoji to edit. Click the colour swatch to change colour.</p>
      </div>
      <div class="cats-list" id="cats-list"></div>
      <div class="add-cat-row">
        <div class="section-label" style="margin-bottom:var(--space-2)">Add New Category</div>
        <div class="add-cat-form">
          <input type="text" id="new-cat-emoji" class="emoji-pick" placeholder="📌" maxlength="2"/>
          <input type="text" id="new-cat-name" class="text-input" placeholder="Category name…"/>
          <button class="btn-primary btn-sm" id="add-cat-btn">Add</button>
        </div>
      </div>
    </div>
  </aside>

  <div id="map"></div>
</div>

<!-- Pin Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3>Name this pin</h3>
    <div class="modal-field">
      <label>Label</label>
      <input type="text" id="modal-label" placeholder="e.g. Dublin Chamber HQ…"/>
    </div>
    <div class="modal-field">
      <label>Category</label>
      <select id="modal-cat"></select>
    </div>
    <div class="modal-field">
      <label>Notes (optional)</label>
      <input type="text" id="modal-notes" placeholder="Any extra details…"/>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" id="modal-cancel">Cancel</button>
      <button class="btn-confirm" id="modal-confirm">Add Pin</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── THEME ───────────────────────────────────────────────────────────────────
(function(){
  const t=document.querySelector('[data-theme-toggle]'),r=document.documentElement;
  let d=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  r.setAttribute('data-theme',d);
  const icons={dark:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',light:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'};
  t.innerHTML=icons[d];
  t.addEventListener('click',()=>{d=d==='dark'?'light':'dark';r.setAttribute('data-theme',d);t.innerHTML=icons[d];});
})();

// ─── MAP ──────────────────────────────────────────────────────────────────────
const map = L.map('map').setView([20, 0], 2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,attribution:'© <a href="https://openstreetmap.org" target="_blank">OpenStreetMap</a>'
}).addTo(map);

// ─── STATE ────────────────────────────────────────────────────────────────────
let categories = [
  { id:'chamber',    name:'Chamber',         emoji:'🏛️', color:'#01696f' },
  { id:'biznet',     name:'Business Network',emoji:'🤝', color:'#da7101' },
  { id:'member',     name:'Member',          emoji:'⭐', color:'#006494' },
  { id:'event',      name:'Event',           emoji:'🎪', color:'#7a39bb' },
  { id:'partner',    name:'Partner',         emoji:'🌐', color:'#437a22' },
];
let pins = [];
let activeFilter = '__all__';

// ─── UTILS ────────────────────────────────────────────────────────────────────
function hexToRgb(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return {r,g,b};
}
function lighten(hex,amount=0.7){
  const {r,g,b}=hexToRgb(hex);
  return `rgb(${Math.round(r+(255-r)*amount)},${Math.round(g+(255-g)*amount)},${Math.round(b+(255-b)*amount)})`;
}
function getCat(id){ return categories.find(c=>c.id===id) || categories[0]; }

function showToast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className=`toast ${type} show`;
  clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2800);
}
function updatePinCount(){ document.getElementById('pin-count-num').textContent=pins.length; }

// ─── MARKER ───────────────────────────────────────────────────────────────────
function makeIcon(catId){
  const c=getCat(catId);
  return L.divIcon({
    className:'',
    html:`<div class="custom-pin" style="width:36px;height:36px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${c.color};box-shadow:0 4px 14px ${c.color}66;display:flex;align-items:center;justify-content:center;border:2.5px solid white"><span style="transform:rotate(45deg);font-size:14px">${c.emoji}</span></div>`,
    iconSize:[36,36],iconAnchor:[18,36],popupAnchor:[0,-40]
  });
}

// ─── RENDER CATEGORIES TAB ───────────────────────────────────────────────────
function renderCatsTab(){
  const list=document.getElementById('cats-list');
  list.innerHTML='';
  categories.forEach(cat=>{
    const pinCount=pins.filter(p=>p.cat===cat.id).length;
    const card=document.createElement('div');
    card.className='cat-card';
    card.innerHTML=`
      <div class="cat-swatch" style="background:${lighten(cat.color,0.8)}" title="Click to change colour">
        <span style="pointer-events:none">${cat.emoji}</span>
        <input type="color" value="${cat.color}" data-cid="${cat.id}" class="cat-color-input"/>
      </div>
      <div class="cat-details">
        <div class="cat-name-row">
          <input class="cat-emoji-input" value="${cat.emoji}" maxlength="2" data-cid="${cat.id}" data-field="emoji" title="Edit emoji"/>
          <input class="cat-name-input" value="${cat.name}" data-cid="${cat.id}" data-field="name" title="Click to rename" placeholder="Category name"/>
        </div>
        <div class="cat-count">${pinCount} pin${pinCount!==1?'s':''}</div>
      </div>
      <button class="cat-del" data-del="${cat.id}" title="Delete category" ${pinCount>0?'style="pointer-events:none;opacity:0.3"':''}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>`;
    // colour change
    card.querySelector('.cat-color-input').addEventListener('input',e=>{
      cat.color=e.target.value;
      card.querySelector('.cat-swatch').style.background=lighten(cat.color,0.8);
      refreshAll();
    });
    // emoji/name edit
    card.querySelectorAll('[data-field]').forEach(inp=>{
      inp.addEventListener('change',e=>{
        cat[e.target.dataset.field]=e.target.value.trim()||cat[e.target.dataset.field];
        refreshAll();
      });
    });
    // delete
    card.querySelector('[data-del]')?.addEventListener('click',e=>{
      const cid=e.currentTarget.dataset.del;
      if(pins.some(p=>p.cat===cid)){showToast('Remove all pins in this category first','error');return;}
      categories=categories.filter(c=>c.id!==cid);
      refreshAll();
      showToast('Category removed','error');
    });
    list.appendChild(card);
  });
}

// ─── RENDER FILTER BAR ───────────────────────────────────────────────────────
function renderFilterBar(){
  const bar=document.getElementById('filter-bar');
  bar.innerHTML='';
  const allBtn=document.createElement('button');
  allBtn.className='cat-chip'+(activeFilter==='__all__'?' active':'');
  allBtn.dataset.cat='__all__';allBtn.textContent='All';
  allBtn.addEventListener('click',()=>setFilter('__all__'));
  bar.appendChild(allBtn);
  categories.forEach(cat=>{
    const btn=document.createElement('button');
    btn.className='cat-chip'+(activeFilter===cat.id?' active':'');
    btn.dataset.cat=cat.id;
    btn.innerHTML=`<span class="chip-dot" style="background:${cat.color}"></span>${cat.name}`;
    btn.addEventListener('click',()=>setFilter(cat.id));
    bar.appendChild(btn);
  });
}
function setFilter(id){
  activeFilter=id;
  renderFilterBar();
  renderPinsList();
}

// ─── RENDER CATEGORY SELECTS ─────────────────────────────────────────────────
function renderCatSelects(){
  [document.getElementById('cat-select'),document.getElementById('modal-cat')].forEach(sel=>{
    if(!sel)return;
    const prev=sel.value;
    sel.innerHTML='';
    categories.forEach(cat=>{
      const o=document.createElement('option');
      o.value=cat.id;o.textContent=`${cat.emoji} ${cat.name}`;
      sel.appendChild(o);
    });
    if(categories.find(c=>c.id===prev)) sel.value=prev;
  });
}

// ─── RENDER PINS LIST ────────────────────────────────────────────────────────
function renderPinsList(){
  const list=document.getElementById('pins-list');
  const empty=document.getElementById('empty-state');
  const filtered=activeFilter==='__all__'?pins:pins.filter(p=>p.cat===activeFilter);
  Array.from(list.querySelectorAll('.pin-item')).forEach(el=>el.remove());
  if(filtered.length===0){empty.style.display='flex';return;}
  empty.style.display='none';
  filtered.forEach(pin=>{
    const cat=getCat(pin.cat);
    const div=document.createElement('div');
    div.className='pin-item';div.dataset.id=pin.id;
    div.innerHTML=`
      <div class="pin-icon" style="background:${lighten(cat.color,0.8)}">${cat.emoji}</div>
      <div class="pin-info">
        <div class="pin-name">${pin.label}</div>
        <div class="pin-meta">
          <span class="pin-cat-badge" style="background:${lighten(cat.color,0.75)};color:${cat.color}">${cat.name}</span>
          ${pin.notes?`<span style="color:var(--color-text-faint);font-style:italic;font-size:10px">${pin.notes}</span>`:''}
        </div>
        <div style="font-size:10px;color:var(--color-text-faint);margin-top:2px">${pin.lat.toFixed(3)}, ${pin.lng.toFixed(3)}</div>
      </div>
      <button class="pin-delete" data-del="${pin.id}" aria-label="Remove pin">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>`;
    div.addEventListener('click',e=>{
      if(e.target.closest('[data-del]'))return;
      map.flyTo([pin.lat,pin.lng],10,{duration:1.2});
      pin.marker.openPopup();
      document.querySelectorAll('.pin-item').forEach(el=>el.classList.remove('focused'));
      div.classList.add('focused');
    });
    div.querySelector('[data-del]').addEventListener('click',()=>removePin(pin.id));
    list.appendChild(div);
  });
}

// ─── REFRESH ALL ─────────────────────────────────────────────────────────────
function refreshAll(){
  renderCatsTab();
  renderFilterBar();
  renderCatSelects();
  renderPinsList();
  // update existing markers
  pins.forEach(pin=>{pin.marker.setIcon(makeIcon(pin.cat));});
  updatePinCount();
}

// ─── PIN CRUD ─────────────────────────────────────────────────────────────────
function addPin(lat,lng,label,catId,notes){
  const id=Date.now();
  const cat=getCat(catId);
  const marker=L.marker([lat,lng],{icon:makeIcon(catId)}).addTo(map);
  marker.bindPopup(`
    <div style="font-family:'Satoshi',sans-serif;min-width:150px">
      <div style="font-weight:700;font-size:14px;margin-bottom:4px">${cat.emoji} ${label}</div>
      <div style="font-size:12px;color:${cat.color};font-weight:600">${cat.name}</div>
      ${notes?`<div style="font-size:11px;color:#7a7974;margin-top:4px;font-style:italic">${notes}</div>`:''}
      <div style="font-size:11px;color:#bab9b4;margin-top:4px">${lat.toFixed(4)}, ${lng.toFixed(4)}</div>
    </div>`);
  pins.push({id,lat,lng,label,cat:catId,notes:notes||'',marker});
  updatePinCount();
  renderPinsList();
  renderCatsTab();
}

function removePin(id){
  const idx=pins.findIndex(p=>p.id===id);
  if(idx===-1)return;
  pins[idx].marker.remove();
  pins.splice(idx,1);
  updatePinCount();
  renderPinsList();
  renderCatsTab();
  showToast('Pin removed','error');
}

// ─── MODAL ───────────────────────────────────────────────────────────────────
let modalResolve=null;
function openModal(defaultLabel,preselectedCat){
  document.getElementById('modal-label').value=defaultLabel||'';
  document.getElementById('modal-notes').value='';
  renderCatSelects();
  if(preselectedCat) document.getElementById('modal-cat').value=preselectedCat;
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('modal-label').focus(),100);
  return new Promise(r=>modalResolve=r);
}
function closeModal(result){
  document.getElementById('modal-overlay').classList.remove('open');
  if(modalResolve) modalResolve(result);
}
document.getElementById('modal-cancel').addEventListener('click',()=>closeModal(null));
document.getElementById('modal-confirm').addEventListener('click',()=>{
  const label=document.getElementById('modal-label').value.trim();
  const cat=document.getElementById('modal-cat').value;
  const notes=document.getElementById('modal-notes').value.trim();
  closeModal({label:label||'My Pin',cat,notes});
});
document.getElementById('modal-label').addEventListener('keydown',e=>{
  if(e.key==='Enter') document.getElementById('modal-confirm').click();
  if(e.key==='Escape') closeModal(null);
});

// ─── GEOCODE & ADD ────────────────────────────────────────────────────────────
async function geocode(q){
  const res=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1`,{headers:{'Accept-Language':'en'}});
  const d=await res.json();return d[0]||null;
}
async function handleAdd(){
  const query=document.getElementById('location-input').value.trim();
  if(!query){showToast('Please enter a location','error');return;}
  const btn=document.getElementById('add-btn');
  btn.textContent='…';btn.disabled=true;
  try{
    const result=await geocode(query);
    if(!result){showToast('Location not found — try a different name','error');return;}
    const lat=parseFloat(result.lat),lng=parseFloat(result.lon);
    const defaultLabel=result.display_name.split(',')[0];
    const preselectedCat=document.getElementById('cat-select').value;
    const details=await openModal(defaultLabel,preselectedCat);
    if(!details)return;
    addPin(lat,lng,details.label,details.cat,details.notes);
    map.flyTo([lat,lng],8,{duration:1.5});
    document.getElementById('location-input').value='';
    showToast(`${getCat(details.cat).emoji} ${details.label} pinned!`);
  }catch(e){showToast('Error finding location','error');}
  finally{btn.textContent='Pin it';btn.disabled=false;}
}
document.getElementById('add-btn').addEventListener('click',handleAdd);
document.getElementById('location-input').addEventListener('keydown',e=>{if(e.key==='Enter')handleAdd();});

// ─── MAP CLICK ────────────────────────────────────────────────────────────────
map.on('click',async e=>{
  const{lat,lng}=e.latlng;
  const preselectedCat=document.getElementById('cat-select').value;
  const details=await openModal('',preselectedCat);
  if(!details)return;
  addPin(lat,lng,details.label,details.cat,details.notes);
  showToast(`${getCat(details.cat).emoji} ${details.label} pinned!`);
});

// ─── TABS ─────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('tab-'+tab.dataset.tab).classList.add('active');
  });
});

// ─── ADD CATEGORY ─────────────────────────────────────────────────────────────
document.getElementById('add-cat-btn').addEventListener('click',()=>{
  const emoji=document.getElementById('new-cat-emoji').value.trim()||'📌';
  const name=document.getElementById('new-cat-name').value.trim();
  if(!name){showToast('Enter a category name','error');return;}
  const id='cat_'+Date.now();
  const colors=['#01696f','#da7101','#006494','#7a39bb','#437a22','#a12c7b','#964219'];
  const color=colors[categories.length%colors.length];
  categories.push({id,name,emoji,color});
  document.getElementById('new-cat-name').value='';
  document.getElementById('new-cat-emoji').value='';
  refreshAll();
  showToast(`${emoji} ${name} category added!`,'info');
});
document.getElementById('new-cat-name').addEventListener('keydown',e=>{
  if(e.key==='Enter') document.getElementById('add-cat-btn').click();
});

// ─── EXPORT ───────────────────────────────────────────────────────────────────
document.getElementById('export-btn').addEventListener('click',()=>{
  const data={categories,pins:pins.map(({id,lat,lng,label,cat,notes})=>({id,lat,lng,label,cat,notes}))};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='world-pins.json';a.click();
  showToast('Pins exported as JSON','info');
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
refreshAll();
</script>
</body>
</html>
